services:
  - type: web
    name: campusmart-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn --bind 0.0.0.0:$PORT --workers 1 --access-logfile - --error-logfile - config.wsgi:application
    healthCheckPath: /api/listings/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: DJANGO_DB_PATH
        value: /tmp/campusmart.sqlite3
